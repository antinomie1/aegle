name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The renderer features of aegle-app are mutually exclusive, so
      # `--all-features` covers every other crate; the `renderers` job covers
      # aegle and aegle-app once per renderer. The SDL3 backend loads
      # libSDL3.so.0 at run time, so its tests report a missing library and pass
      # here rather than needing a distribution package.
      - run: cargo clippy --workspace --exclude aegle --exclude aegle-app --all-targets --all-features
      - run: cargo test --workspace --exclude aegle --exclude aegle-app --all-features
      - run: cargo doc --workspace --exclude aegle --exclude aegle-app --all-features --no-deps
  renderers:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      # Every aegle feature except the renderers, including the window backend
      # the renderers present into.
      FEATURES: aegle/desktop,aegle/sdl3,aegle/accessibility,aegle/jpeg,aegle/webp,aegle/gif,aegle/svg,aegle/colrv1,aegle/grid
    strategy:
      fail-fast: false
      matrix:
        renderer: [tiny-skia, cairo, vulkan, wgpu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev
      - run: cargo clippy -p aegle -p aegle-app --all-targets --no-default-features --features "$FEATURES,aegle/${{ matrix.renderer }}"
      - run: cargo test -p aegle -p aegle-app --no-default-features --features "$FEATURES,aegle/${{ matrix.renderer }}"
      - run: cargo doc -p aegle -p aegle-app --no-deps --no-default-features --features "$FEATURES,aegle/${{ matrix.renderer }}"
  features:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - markup
          - markup,native
          - markup,native,sdl3
          - markup,native,sdl3,tiny-skia
          - markup,motion
          - motion,native,sdl3,tiny-skia
          - grid,markup
          - native,sdl3,vulkan
          - native,sdl3,wgpu
          - native,sdl3,cairo
          - accessibility,sdl3
          # The native Wayland client instead of SDL3, with its own renderer.
          - native,wayland,tiny-skia
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev
      - run: cargo check -p aegle --all-targets --no-default-features --features "${{ matrix.features }}"
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev
      - run: cargo check --workspace --exclude aegle --exclude aegle-app --all-features
      - run: cargo check -p aegle -p aegle-app --all-targets --features aegle/sdl3,aegle/accessibility,aegle/jpeg,aegle/webp,aegle/gif,aegle/svg,aegle/colrv1,aegle/grid
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Only the Windows crates: the Wayland crate needs libxkbcommon.
      - run: cargo clippy -p aegle-platform-win32 --all-targets -- -D warnings
      - run: cargo clippy -p aegle --all-targets --no-default-features --features "native,tiny-skia,markup,motion" -- -D warnings
      - run: cargo clippy -p aegle --all-targets --no-default-features --features "native,vulkan,accessibility" -- -D warnings
      - run: cargo clippy -p aegle --all-targets --no-default-features --features "native,wgpu,accessibility" -- -D warnings
      # Native window and input-method tests stay opt-in (`--ignored`) on a test desktop.
      - run: cargo test -p aegle-platform-win32
      # DirectWrite renders the glyph coverage; these tests need the real system.
      - run: cargo test -p aegle-glyph
      - run: cargo test -p aegle --no-default-features --features "native,tiny-skia,markup,motion,accessibility"
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Only the macOS crates: the Wayland crate needs libxkbcommon.
      - run: cargo clippy -p aegle-platform-macos --all-targets -- -D warnings
      - run: cargo clippy -p aegle --all-targets --no-default-features --features "native,tiny-skia,markup,motion" -- -D warnings
      - run: cargo clippy -p aegle --all-targets --no-default-features --features "native,wgpu,accessibility" -- -D warnings
      # The window model tests run anywhere; native window tests need a GUI session.
      - run: cargo test -p aegle-platform-macos
      # CoreText renders the glyph coverage; these tests need the real system.
      - run: cargo test -p aegle-glyph
      - run: cargo test -p aegle --no-default-features --features "native,tiny-skia,markup,motion,accessibility"
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
