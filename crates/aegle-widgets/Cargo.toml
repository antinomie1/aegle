[package]
name = "aegle-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The default control library: buttons, labels, editors, toggles, sliders, lists, tables, popups and their skins"

[features]
default = []
# Semantic roles and actions for assistive technology.
accessibility = ["aegle-ui/accessibility", "dep:aegle-access"]
motion = ["aegle-ui/motion"]
# ShaderView: views filled by custom fragment programs, checked as they are set.
shaders = ["dep:aegle-gpu", "aegle-gpu/shaders"]

[dependencies]
aegle-types.workspace = true
aegle-scene = { workspace = true, features = ["text"] }
aegle-theme.workspace = true
aegle-core.workspace = true
aegle-layout.workspace = true
aegle-controls = { workspace = true, features = ["text"] }
aegle-text = { workspace = true, features = ["scene"] }
aegle-ui.workspace = true
aegle-image.workspace = true
aegle-access = { workspace = true, optional = true }
aegle-gpu = { workspace = true, optional = true }

[dev-dependencies]
aegle-text.workspace = true
aegle-motion.workspace = true
aegle-render-tiny-skia = { workspace = true, features = ["text"] }

[[example]]
name = "standalone"
required-features = ["motion"]

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
