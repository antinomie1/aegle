[package]
name = "aegle-platform-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Windows windows, input, IMM compatibility and bounded software presentation"

[dependencies]
aegle-types.workspace = true
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_Security", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
