[package]
name = "aegle-platform-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native Windows windows, input, TSF text input and bounded software presentation"

[dependencies]
# The crate documentation links to the contracts on every target.
aegle-platform.workspace = true

# The implementation; the crate is otherwise empty on other targets.
[target.'cfg(windows)'.dependencies]
aegle-types = { workspace = true, features = ["std"] }
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_Security", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
# The `implement` macro names windows-core directly.
windows-core = { version = "0.62.2", default-features = false }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

# docs.rs builds only the listed targets; the platform code is cfg-gated.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
