[package]
name = "aegle-image"
description = "Bounded image decoding (PNG, JPEG, WebP, GIF, SVG) and gradient/shadow generation as scene images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Linear/radial gradient and soft shadow images.
effects = ["aegle-types/color-math"]
jpeg = ["dep:zune-jpeg"]
webp = ["dep:image-webp"]
gif = ["dep:gif"]
# Static SVG without text, rasterized at a requested size.
svg = ["dep:resvg"]

[dependencies]
aegle-scene.workspace = true
aegle-types.workspace = true
png = { version = "0.18.1", default-features = false }
zune-jpeg = { version = "0.5.9", default-features = false, features = ["std"], optional = true }
image-webp = { version = "0.2.4", default-features = false, optional = true }
gif = { version = "0.14.1", default-features = false, features = ["std"], optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }

[dev-dependencies]
# Encoders that build the decoder tests' inputs.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp", "gif", "png"] }
png = "0.18.1"

[lints]
workspace = true
