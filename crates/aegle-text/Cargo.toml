[package]
name = "aegle-text"
description = "Retained Unicode paragraphs and editors with shared font resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
system-fonts = []
text-a11y = ["dep:accesskit", "parley?/accesskit"]
scene = ["dep:aegle-scene", "aegle-scene/text"]
# The Parley/HarfRust Rust text stack as a fallback: default off and no longer
# maintained. Every target defaults to its own system text stack.
text-parley = ["dep:parley", "dep:icu_segmenter", "dep:icu_provider"]

[dependencies]
aegle-segment.workspace = true
aegle-types.workspace = true
linebender_resource_handle.workspace = true
parley = { workspace = true, optional = true }
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"], optional = true }
# ICU's rule-based segmentation (graphemes, line breaking) needs its data;
# routes its diagnostics, such as a missing dictionary model, to `log` instead
# of debug-build stderr. Word dictionaries come from the system segmenter in
# `aegle-segment`, not from here.
icu_provider = { version = "2.3.1", default-features = false, features = ["logging"], optional = true }
aegle-scene = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
libloading = "0.8.9"

[lints.rust]
unsafe_code = "warn"
