[package]
name = "aegle-text"
description = "Retained Unicode paragraphs and editors with shared font resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
system-fonts = []
text-a11y = ["dep:accesskit", "parley?/accesskit"]
scene = ["dep:aegle-scene", "aegle-scene/text"]
# The Parley/HarfRust Rust text stack as a fallback: default off and no longer
# maintained. Every target defaults to its own system text stack.
text-parley = ["dep:parley", "dep:icu_segmenter", "dep:icu_provider"]

[dependencies]
aegle-segment.workspace = true
aegle-types.workspace = true
linebender_resource_handle.workspace = true
parley = { workspace = true, optional = true }
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"], optional = true }
# ICU's rule-based segmentation (graphemes, line breaking) needs its data;
# routes its diagnostics, such as a missing dictionary model, to `log` instead
# of debug-build stderr. Word dictionaries come from the system segmenter in
# `aegle-segment`, not from here.
icu_provider = { version = "2.3.1", default-features = false, features = ["logging"], optional = true }
aegle-scene = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"

# CoreText layout, CoreGraphics outlines and the CoreFoundation objects both use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "CFArray", "CFAttributedString", "CFCGTypes", "CFData", "CFDictionary",
    "CFString", "CFURL",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "std", "CTFont", "CTFontDescriptor", "CTFontManager", "CTFontTraits", "CTFrame",
    "CTFramesetter", "CTLine", "CTParagraphStyle", "CTRun", "CTStringAttributes",
    "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std", "CGAffineTransform", "CGDataProvider", "CGFont", "CGPath",
] }
aegle-glyph = { workspace = true }

# DirectWrite layout, Uniscribe grapheme breaks and GDI outlines.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi",
    "Win32_Globalization", "Win32_System_Com",
] }
aegle-glyph = { workspace = true }
# The `implement` macro names windows-core directly.
windows-core = { version = "0.62.2", default-features = false }

# Until the DirectWrite and CoreText backends exist, those targets keep the
# Parley stack: text must not disappear from a default build.
[target.'cfg(not(target_os = "linux"))'.dependencies]
parley.workspace = true
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_provider = { version = "2.3.1", default-features = false, features = ["logging"] }

[lints.rust]
unsafe_code = "warn"
