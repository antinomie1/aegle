[package]
name = "aegle-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless retained UI: tree, layout, input, focus, scrolling, motion, theme and the default controls"

[features]
default = []
motion = ["dep:aegle-motion"]
system-fonts = ["aegle-text/system-fonts"]
accessibility = ["dep:aegle-access", "aegle-text/text-a11y"]
# Grid and stack containers (about 244 KiB of Taffy grid code in a release build).
grid = ["aegle-layout/grid"]

[dependencies]
aegle-types.workspace = true
aegle-core.workspace = true
aegle-layout.workspace = true
aegle-theme.workspace = true
aegle-motion = { workspace = true, optional = true }
aegle-scene = { workspace = true, features = ["text"] }
aegle-text = { workspace = true, features = ["scene"] }
aegle-controls = { workspace = true, features = ["text"] }
aegle-access = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
