[package]
name = "aegle-render-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bounded Vulkan 1.1 rendering of retained Aegle scenes"

[features]
default = []
window = ["dep:raw-window-handle", "dep:windows"]
text = ["aegle-scene/text", "aegle-gpu/vector", "dep:aegle-glyph", "dep:hashbrown"]

[dependencies]
aegle-gpu.workspace = true
aegle-scene.workspace = true
aegle-types = { workspace = true, features = ["color-math"] }
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
aegle-glyph = { workspace = true, optional = true, features = ["scene"] }
hashbrown = { version = "0.17.1", default-features = false, optional = true }

raw-window-handle = { version = "0.6.2", optional = true }

# Transparent Win32 windows present through DirectComposition.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, optional = true, features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Security", "Win32_System_Threading",
] }

[build-dependencies]
aegle-gpu.workspace = true
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
aegle-scene = { workspace = true, features = ["text"] }
aegle-render-tiny-skia = { workspace = true, features = ["text"] }
aegle-text = { workspace = true, features = ["scene"] }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[[example]]
name = "vulkan_text_scene"
required-features = ["text"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
aegle-platform.workspace = true
aegle-platform-wayland = { workspace = true, features = ["gpu"] }

[[test]]
name = "layers"
required-features = ["text"]

[[example]]
name = "vulkan_layer_cost"
required-features = ["text"]
