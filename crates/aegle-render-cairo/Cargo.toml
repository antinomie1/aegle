[package]
name = "aegle-render-cairo"
description = "Linux CPU rendering of Aegle scenes through the system cairo library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
text = ["aegle-render-cpu/text", "aegle-scene/text"]

[dependencies]
aegle-render-cpu.workspace = true
aegle-scene.workspace = true
aegle-types = { workspace = true, features = ["color-math"] }
libloading = "0.8.9"

[dev-dependencies]
aegle-render-cpu.workspace = true
aegle-render-tiny-skia = { workspace = true, features = ["text"] }

[lints.rust]
# Cairo is reached through dlopen and raw C entry points; every unsafe block
# documents the invariant it relies on.
unsafe_code = "warn"
missing_docs = "warn"
