[package]
name = "aegle-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native application host: windows, event loop, renderers, system preferences and background proxies"

[features]
default = []
motion = ["aegle-ui/motion"]
system-fonts = ["aegle-ui/system-fonts"]
accessibility = ["aegle-ui/accessibility"]
wayland = ["dep:aegle-platform-wayland", "dep:wayland-client"]
windows = ["dep:aegle-platform-win32"]
software = ["dep:aegle-render-software"]
vulkan = ["dep:aegle-render-vulkan", "aegle-platform-wayland?/gpu"]
wgpu = ["dep:aegle-render-wgpu", "aegle-platform-wayland?/gpu"]
windows-accessibility = ["windows", "accessibility", "aegle-access/windows"]
unix-accessibility = ["wayland", "accessibility", "aegle-access/unix"]

[dependencies]
aegle-ui.workspace = true
aegle-types.workspace = true
aegle-scene.workspace = true
aegle-text.workspace = true
aegle-access = { workspace = true, optional = true }
aegle-render-software = { workspace = true, features = ["text"], optional = true }
aegle-render-vulkan = { workspace = true, features = ["text", "window"], optional = true }
aegle-render-wgpu = { workspace = true, features = ["text", "window"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
aegle-platform-wayland = { workspace = true, optional = true }
wayland-client = { version = "0.31.15", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
aegle-platform-win32 = { path = "../aegle-platform-win32", optional = true }

[dev-dependencies]
aegle-text = { workspace = true, features = ["scene"] }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
