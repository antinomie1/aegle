[package]
name = "aegle-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native application host: windows, event loop, renderers, system preferences and background proxies"

[features]
default = []
motion = ["aegle-ui/motion"]
system-fonts = ["aegle-ui/system-fonts", "aegle-text/system-fonts"]
# The semantic tree plus the system adapter of the target: AT-SPI on Linux,
# UI Automation on Windows, NSAccessibility on macOS. The adapter attaches to a
# native window, so this implies `native`; the other targets' adapters are not
# built.
accessibility = [
    "native",
    "dep:aegle-access",
    "aegle-access/platform",
    "aegle-ui/accessibility",
]
# Native windows: the host plus the target's window backend. Windows and macOS
# always use their own crate; a Linux build gets one from `sdl3` (the facade's
# default) or `wayland`, which are mutually exclusive.
native = ["windows", "macos"]
sdl3 = ["native", "dep:aegle-platform-sdl3"]
wayland = ["native", "dep:aegle-platform-wayland"]
windows = ["dep:aegle-platform-win32"]
macos = ["dep:aegle-platform-macos"]
tiny-skia = ["dep:aegle-render-tiny-skia", "dep:aegle-render-cpu"]
# System cairo as a second CPU coverage rasterizer; Linux only, loaded at run
# time, so no build-time dependency on cairo headers or libraries.
cairo = ["dep:aegle-render-cairo", "dep:aegle-render-cpu"]
# Vulkan is the Linux and Windows GPU path and reports `Unsupported` on macOS;
# `wgpu` reaches Metal there.
vulkan = ["dep:aegle-render-vulkan", "dep:raw-window-handle", "aegle-platform-wayland?/gpu", "aegle-platform-sdl3?/gpu"]
wgpu = ["dep:aegle-render-wgpu", "dep:raw-window-handle", "aegle-platform-wayland?/gpu", "aegle-platform-sdl3?/gpu"]
# File dialogs, notifications, a tray icon and global shortcuts (`App::desktop`).
desktop-services = ["native", "dep:aegle-desktop"]

[dependencies]
aegle-ui.workspace = true
aegle-desktop = { workspace = true, optional = true }
aegle-platform.workspace = true
aegle-types.workspace = true
aegle-scene.workspace = true
aegle-text.workspace = true
# Only the GPU renderers and a build without a window backend need the handle
# traits here; both backends bring their own copy of the crate.
raw-window-handle = { version = "0.6.2", optional = true }
aegle-access = { workspace = true, optional = true }
aegle-render-tiny-skia = { workspace = true, features = ["text"], optional = true }
# The compositor both CPU backends share; named here so the host can draw into
# either one without knowing which rasterizer it holds.
aegle-render-cpu = { workspace = true, features = ["text"], optional = true }
aegle-render-cairo = { workspace = true, features = ["text"], optional = true }
aegle-render-vulkan = { workspace = true, features = ["text", "window"], optional = true }
aegle-render-wgpu = { workspace = true, features = ["text", "window"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
aegle-platform-sdl3 = { workspace = true, optional = true }
aegle-platform-wayland = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
aegle-platform-win32 = { path = "../aegle-platform-win32", version = "0.1.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
aegle-platform-macos = { path = "../aegle-platform-macos", version = "0.1.0", optional = true }

[dev-dependencies]
aegle-widgets.workspace = true
aegle-text = { workspace = true, features = ["scene"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Drives a virtual pointer in the private test compositor.
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole",
    "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
# The `implement` macro of the test text service names windows-core directly.
windows-core = { version = "0.62.2", default-features = false }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
