[package]
name = "aegle-loader"
description = "Runtime engine for dynamic Aegle markup: states, bindings, events, blocks, components and loading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
motion = ["aegle-ui/motion", "aegle-widgets/motion"]
grid = ["aegle-ui/grid"]
wayland = ["dep:aegle-app", "aegle-app/wayland"]
windows = ["dep:aegle-app", "aegle-app/windows"]

[dependencies]
aegle-ui.workspace = true
aegle-widgets.workspace = true
aegle-app = { workspace = true, optional = true }
aegle-markup.workspace = true

[dev-dependencies]
aegle-access.workspace = true
aegle-ui = { workspace = true, features = ["accessibility"] }
aegle-widgets = { workspace = true, features = ["accessibility"] }
aegle-text.workspace = true

[lints]
workspace = true
