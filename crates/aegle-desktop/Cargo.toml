[package]
name = "aegle-desktop"
description = "File dialogs, notifications, a tray icon and global shortcuts for Linux desktops and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aegle-dbus.workspace = true
aegle-types = { workspace = true, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com",
    "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
