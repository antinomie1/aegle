[package]
name = "aegle-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Event-driven accessibility adapters over retained application state"

[features]
default = []
unix = ["dep:accesskit_unix"]
windows = ["dep:accesskit_windows", "dep:raw-window-handle"]

[dependencies]
accesskit.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
accesskit_unix = { version = "0.22.1", optional = true, default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
accesskit_windows = { version = "0.34.0", optional = true }
raw-window-handle = { version = "0.6.2", optional = true, features = ["std"] }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
