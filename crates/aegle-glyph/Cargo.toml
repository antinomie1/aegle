[package]
name = "aegle-glyph"
description = "On-demand glyph rasterization with a bounded CPU image cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Glyph identity and raster transforms shared with scene consumers. The scene
# crate is always linked: `FontSource` is the rasterizer's font identity.
scene = []
# Fallback Rust rasterizer (unmaintained)
swash = ["dep:swash", "dep:skrifa"]
# COLRv1 gradient/composite color glyphs, painted with tiny-skia.
colrv1 = ["dep:tiny-skia", "swash"]
# OpenType-SVG glyph documents (static, no text), rendered by resvg.
svg = ["dep:resvg", "swash"]

[dependencies]
aegle-scene = { workspace = true, features = ["text"] }
linebender_resource_handle.workspace = true
swash = { workspace = true, optional = true }
skrifa = { version = "0.44.0", default-features = false, features = ["std"], optional = true }
aegle-image.workspace = true
tiny-skia = { workspace = true, optional = true }
resvg = { version = "0.48.1", default-features = false, features = ["svgz"], optional = true }
hashbrown = { version = "0.17.1", default-features = false }
lru-slab = "0.1.3"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"

# Only Linux renders through the system FreeType for now; other targets keep the
# Rust rasterizer until their own system path exists.
[target.'cfg(not(target_os = "linux"))'.dependencies]
swash.workspace = true
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[dev-dependencies]
swash.workspace = true
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[[test]]
name = "retained"
required-features = ["swash"]

[[test]]
name = "colrv1"
required-features = ["colrv1"]

[[test]]
name = "svg"
required-features = ["svg"]

[lints.rust]
unsafe_code = "warn"
