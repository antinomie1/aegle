[package]
name = "aegle-glyph"
description = "On-demand glyph rasterization with a bounded CPU image cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Glyph identity and raster transforms shared with scene consumers. The scene
# crate is always linked: `FontSource` is the rasterizer's font identity.
scene = []
# Fallback Rust rasterizer (unmaintained). Linux, Windows and macOS default to
# their system backends; this feature is how the Rust path is compiled there.
# It replaces the platform rasterizer, so glyph pixels change.
swash = ["dep:swash", "dep:skrifa"]
# COLRv1 gradient/composite color glyphs. Skrifa parses the paint graph and
# tiny-skia paints it; this does not replace the platform rasterizer. It is the
# only feature that makes this crate depend on tiny-skia.
colrv1 = ["dep:skrifa", "dep:tiny-skia"]
# OpenType-SVG glyph documents (static, no text), rendered by resvg. The SVG
# table is located through Skrifa; this does not replace the platform rasterizer.
svg = ["dep:resvg", "dep:skrifa"]

[dependencies]
aegle-scene = { workspace = true, features = ["text"] }
linebender_resource_handle.workspace = true
swash = { workspace = true, optional = true }
skrifa = { version = "0.44.0", default-features = false, features = ["std"], optional = true }
aegle-image.workspace = true
# COLRv1 painting only; plain glyphs come from the platform rasterizer.
tiny-skia = { workspace = true, optional = true }
resvg = { version = "0.48.1", default-features = false, features = ["svgz"], optional = true }
hashbrown = { version = "0.17.1", default-features = false }
lru-slab = "0.1.3"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"

# DirectWrite glyph-run analysis renders grayscale alpha textures.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation", "Win32_Graphics_DirectWrite",
] }

# CoreText draws glyphs into an alpha-only CoreGraphics bitmap context.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "CFData", "CFCGTypes", "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGFont", "CGImage",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "std", "CTFont", "CTFontDescriptor", "CTFontTraits", "objc2-core-graphics",
] }

# A target with no system glyph backend still needs a rasterizer so glyphs never
# silently disappear. Linux, Windows and macOS use their own backend unless the
# `swash` feature is enabled.
[target.'cfg(not(any(target_os = "linux", target_os = "windows", target_os = "macos")))'.dependencies]
swash.workspace = true
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[dev-dependencies]
swash.workspace = true
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[[test]]
name = "retained"
required-features = ["swash"]

[[test]]
name = "colrv1"
required-features = ["colrv1"]

[[test]]
name = "svg"
required-features = ["svg"]

[lints.rust]
unsafe_code = "warn"
