[package]
name = "aegle-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native macOS windows, input, NSTextInputClient text input and bounded software presentation"

[dependencies]
aegle-platform.workspace = true
aegle-types = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSDate", "NSEnumerator", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSRange", "NSRunLoop", "NSString", "NSProcessInfo", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "NSApplication", "NSCursor", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSAccessibility", "NSColor", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSScreen", "NSTextInputClient", "NSTextInputContext", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace", "NSAppearance", "NSRunningApplication"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage", "CGGeometry"] }

[[test]]
name = "native"
# AppKit runs on the main thread only; the target has its own `main`.
harness = false

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

# docs.rs builds only the listed targets; the platform code is cfg-gated.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
