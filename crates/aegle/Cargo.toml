[package]
name = "aegle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A small retained GUI with imperative controls and composable backends"

[features]
default = ["desktop"]
# System accessibility adapters are opt-in: `unix-accessibility` (AT-SPI over
# zbus) and `windows-accessibility` (UI Automation); `accessibility` alone
# exports the semantic tree without a platform adapter.
desktop = ["native", "software", "system-fonts", "markup", "motion", "effects", "colrv1"]
native = ["wayland", "windows"]
motion = ["aegle-ui/motion", "aegle-widgets/motion", "aegle-app/motion", "aegle-loader?/motion"]
effects = ["aegle-image/effects"]
markup = ["dep:aegle-macros", "dep:aegle-loader"]
wayland = ["aegle-app/wayland", "aegle-loader?/wayland"]
windows = ["aegle-app/windows", "aegle-loader?/windows"]
software = ["aegle-app/software"]
vulkan = ["aegle-app/vulkan"]
wgpu = ["aegle-app/wgpu"]
system-fonts = ["aegle-ui/system-fonts", "aegle-app/system-fonts"]
accessibility = ["aegle-ui/accessibility", "aegle-widgets/accessibility", "aegle-app/accessibility"]
windows-accessibility = ["aegle-app/windows-accessibility"]
unix-accessibility = ["aegle-app/unix-accessibility"]
# Extra image formats beyond the always-available PNG, in `aegle::image`; `effects`
# adds `aegle::image::effects`.
jpeg = ["aegle-image/jpeg"]
webp = ["aegle-image/webp"]
gif = ["aegle-image/gif"]
# Also renders OpenType-SVG glyphs.
svg = ["aegle-image/svg", "aegle-glyph/svg"]
# COLRv1 gradient/composite color glyphs.
colrv1 = ["aegle-glyph/colrv1"]
# Grid and stack containers, and the Grid/Stack markup components (about
# 244 KiB of Taffy grid code in a release build).
grid = ["aegle-ui/grid", "aegle-loader?/grid"]

[dependencies]
aegle-ui.workspace = true
aegle-widgets.workspace = true
aegle-app.workspace = true
aegle-glyph = { workspace = true, features = ["scene"] }
aegle-macros = { workspace = true, optional = true }
aegle-loader = { workspace = true, optional = true }
aegle-image.workspace = true

[dev-dependencies]
aegle-text.workspace = true
aegle-render-software = { workspace = true, features = ["text"] }
png = "0.18.1"

[[example]]
name = "hello"
required-features = ["native", "system-fonts"]

[[example]]
name = "controls"
required-features = ["native", "system-fonts"]

[[example]]
name = "hello_markup"
required-features = ["native", "system-fonts", "markup"]

[[example]]
name = "markup_controls"
required-features = ["native", "system-fonts", "markup"]

[[example]]
name = "components"
required-features = ["native", "system-fonts", "markup", "motion"]

[lints]
workspace = true

[[example]]
name = "widgets"
required-features = ["native", "system-fonts", "markup", "motion"]

[[example]]
name = "scrolling"
required-features = ["native", "system-fonts", "markup"]

[[example]]
name = "visuals"
required-features = ["native", "system-fonts"]

[[example]]
name = "dynamic"
required-features = ["native", "system-fonts", "markup"]

[[example]]
name = "gallery"
required-features = ["motion"]

[[example]]
name = "showcase"
required-features = ["native", "system-fonts"]

[[example]]
name = "layout"
required-features = ["native", "system-fonts", "markup", "grid"]

[[example]]
name = "gpu_texture"
required-features = ["native", "wgpu", "system-fonts"]
