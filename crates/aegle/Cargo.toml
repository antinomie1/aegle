[package]
name = "aegle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A small retained GUI with imperative controls and composable backends"

[features]
default = ["desktop"]
# System accessibility is opt-in: one feature adds the semantic tree and the
# adapter of the target (AT-SPI over zbus on Linux, UI Automation on Windows,
# NSAccessibility on macOS). Only that target's adapter is compiled.
accessibility = [
    "native",
    "aegle-ui/accessibility",
    "aegle-widgets/accessibility",
    "aegle-app/accessibility",
]
desktop = ["native", "software", "system-fonts", "markup", "motion", "effects", "desktop-services"]
# File dialogs, notifications, a tray icon and global shortcuts: `App::desktop`
# and `aegle::desktop`.
desktop-services = ["native", "aegle-app/desktop-services"]
# The target's native window: Wayland on Linux, Win32 on Windows, AppKit on
# macOS. The other targets' platform crates are not built.
native = ["aegle-app/native", "aegle-loader?/window"]
motion = ["aegle-ui/motion", "aegle-widgets/motion", "aegle-app/motion", "aegle-loader?/motion"]
effects = ["aegle-image/effects"]
markup = ["dep:aegle-macros", "dep:aegle-loader"]
software = ["aegle-app/software"]
# System cairo as a second CPU coverage rasterizer, Linux only. The library is
# loaded at run time; a missing `libcairo.so.2` fails the frame with an error.
cairo = ["aegle-app/cairo"]
# Vulkan is the Linux and Windows GPU path; on macOS it fails at run time with
# `Unsupported`, and `wgpu` is the Metal path.
vulkan = ["aegle-app/vulkan"]
wgpu = ["aegle-app/wgpu"]
system-fonts = ["aegle-ui/system-fonts", "aegle-app/system-fonts"]
# Extra image formats beyond the always-available PNG, in `aegle::image`; `effects`
# adds `aegle::image::effects`.
jpeg = ["aegle-image/jpeg"]
webp = ["aegle-image/webp"]
gif = ["aegle-image/gif"]
# Also renders OpenType-SVG glyphs.
svg = ["aegle-image/svg", "aegle-glyph/svg"]
# COLRv1 gradient/composite color glyphs.
colrv1 = ["aegle-glyph/colrv1"]
# Grid and stack containers, and the Grid/Stack markup components (about
# 244 KiB of Taffy grid code in a release build).
grid = ["aegle-ui/grid", "aegle-loader?/grid"]

[dependencies]
aegle-ui.workspace = true
aegle-widgets.workspace = true
aegle-app.workspace = true
aegle-glyph = { workspace = true, features = ["scene"] }
aegle-macros = { workspace = true, optional = true }
aegle-loader = { workspace = true, optional = true }
aegle-image.workspace = true

[dev-dependencies]
aegle-text.workspace = true
aegle-render-tiny-skia = { workspace = true, features = ["text"] }
png = "0.18.1"

[[example]]
name = "hello"
required-features = ["native", "system-fonts"]

[[example]]
name = "controls"
required-features = ["native", "system-fonts"]

[[example]]
name = "hello_markup"
required-features = ["native", "system-fonts", "markup"]

[[example]]
name = "markup_controls"
required-features = ["native", "system-fonts", "markup"]

[[example]]
name = "components"
required-features = ["native", "system-fonts", "markup", "motion"]

[lints]
workspace = true

[[example]]
name = "widgets"
required-features = ["native", "system-fonts", "markup", "motion"]

[[example]]
