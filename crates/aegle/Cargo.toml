[package]
name = "aegle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A small retained GUI with imperative controls and composable backends"

[features]
# `desktop` holds everything but the renderer and the Linux window backend, so
# another renderer replaces tiny-skia with
# `--no-default-features --features desktop,<renderer>` and the native Wayland
# client replaces SDL3 with
# `--no-default-features --features desktop,wayland,<renderer>`.
default = ["desktop", "sdl3", "tiny-skia"]
# System accessibility is opt-in: one feature adds the semantic tree and the
# adapter of the target (AT-SPI over zbus on Linux, UI Automation on Windows,
# NSAccessibility on macOS). Only that target's adapter is compiled.
accessibility = [
    "native",
    "aegle-ui/accessibility",
    "aegle-widgets/accessibility",
    "aegle-app/accessibility",
]
desktop = ["native", "system-fonts", "markup", "motion", "effects", "desktop-services"]
# File dialogs, notifications, a tray icon and global shortcuts: `App::desktop`
# and `aegle::desktop`.
desktop-services = ["native", "aegle-app/desktop-services"]
# Native windows: Win32 on Windows and AppKit on macOS, plus the window host.
# On Linux the backend is a separate feature (`sdl3`, the default, or
# `wayland`), because a build carries exactly one and the facade's defaults
# already name the one Linux uses.
native = ["aegle-app/native", "aegle-loader?/window"]
# Linux: windows through the distribution's SDL3 (Wayland or X11, chosen by SDL).
sdl3 = ["aegle-app/sdl3"]
# Linux: the native Wayland client instead, with layer-shell surfaces, a drag
# source and text-input-v3 surrounding text. Needs libxkbcommon at build time.
wayland = ["aegle-app/wayland"]
motion = ["aegle-ui/motion", "aegle-widgets/motion", "aegle-app/motion", "aegle-loader?/motion"]
effects = ["aegle-image/effects"]
markup = ["dep:aegle-macros", "dep:aegle-loader"]
# The renderer: exactly one of these four, enabling two is a compile error.
# CPU rendering with tiny-skia coverage, on every platform.
tiny-skia = ["aegle-app/tiny-skia"]
# CPU rendering with system cairo coverage, Linux only. The library is loaded at
# run time; a missing `libcairo.so.2` fails `App` creation with an error.
cairo = ["aegle-app/cairo"]
# Vulkan is the Linux and Windows GPU path; on macOS it fails at `App` creation,
# and `wgpu` is the Metal path.
vulkan = ["aegle-app/vulkan"]
wgpu = ["aegle-app/wgpu"]
system-fonts = ["aegle-ui/system-fonts", "aegle-app/system-fonts"]
# Extra image formats beyond the always-available PNG, in `aegle::image`; `effects`
# adds `aegle::image::effects`.
jpeg = ["aegle-image/jpeg"]
webp = ["aegle-image/webp"]
gif = ["aegle-image/gif"]
# Also renders OpenType-SVG glyphs.
svg = ["aegle-image/svg", "aegle-glyph/svg"]
# COLRv1 gradient/composite color glyphs.
colrv1 = ["aegle-glyph/colrv1"]
# Grid and stack containers, and the Grid/Stack markup components (about
# 244 KiB of Taffy grid code in a release build).
grid = ["aegle-ui/grid", "aegle-loader?/grid"]

[dependencies]
aegle-ui.workspace = true
aegle-widgets.workspace = true
aegle-app.workspace = true
aegle-glyph = { workspace = true, features = ["scene"] }
aegle-macros = { workspace = true, optional = true }
aegle-loader = { workspace = true, optional = true }
aegle-image.workspace = true

[dev-dependencies]
aegle-text.workspace = true
aegle-render-tiny-skia = { workspace = true, features = ["text"] }
png = "0.18.1"

[[example]]
name = "hello"
required-features = ["native", "system-fonts"]

[[example]]
name = "controls"
required-features = ["native", "system-fonts"]

[[example]]
name = "hello_markup"
required-features = ["native", "system-fonts", "markup"]

[[example]]
name = "markup_controls"
required-features = ["native", "system-fonts", "markup"]

[[example]]
name = "components"
required-features = ["native", "system-fonts", "markup", "motion"]

[lints]
workspace = true

[[example]]
name = "widgets"
required-features = ["native", "system-fonts", "markup", "motion"]

[[example]]
