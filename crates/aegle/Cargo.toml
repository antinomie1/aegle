[package]
name = "aegle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A small retained GUI with imperative controls and composable backends"

[features]
default = ["desktop"]
desktop = ["wayland", "system-fonts", "unix-accessibility", "markup", "motion"]
motion = ["aegle-app/motion"]
markup = ["dep:aegle-macros"]
wayland = ["aegle-app/wayland"]
system-fonts = ["aegle-app/system-fonts"]
accessibility = ["aegle-app/accessibility"]
unix-accessibility = ["aegle-app/unix-accessibility"]

[dependencies]
aegle-app.workspace = true
aegle-macros = { workspace = true, optional = true }

[dev-dependencies]
aegle-text.workspace = true

[[example]]
name = "hello"
required-features = ["wayland", "system-fonts"]

[[example]]
name = "controls"
required-features = ["wayland", "system-fonts"]

[[example]]
name = "hello_markup"
required-features = ["wayland", "system-fonts", "markup"]

[[example]]
name = "markup_controls"
required-features = ["wayland", "system-fonts", "markup"]

[[example]]
name = "components"
required-features = ["wayland", "system-fonts", "markup", "motion"]

[lints]
workspace = true
