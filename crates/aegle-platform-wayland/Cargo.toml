[package]
name = "aegle-platform-wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Event-driven Wayland windows and layer surfaces, bounded software presentation, clipboard and text-input-v3"

[dependencies]
aegle-dbus.workspace = true
aegle-types = { workspace = true, features = ["std"] }
smithay-client-toolkit = "0.21.1"
xkbcommon = { version = "0.8.0", default-features = false }
wayland-client = "0.31.15"
raw-window-handle = { version = "0.6.2", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }

[features]
gpu = ["dep:raw-window-handle", "wayland-client/system", "wayland-client/dlopen"]

[dev-dependencies]
aegle-dbus.workspace = true
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
