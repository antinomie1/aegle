[package]
name = "aegle-render-software"
description = "Bounded software rendering of Aegle scenes without a GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
text = ["aegle-scene/text", "dep:aegle-glyph"]

[dependencies]
aegle-types = { workspace = true, features = ["color-math"] }
aegle-scene.workspace = true
tiny-skia.workspace = true
aegle-glyph = { workspace = true, optional = true }

[dev-dependencies]
aegle-core.workspace = true
aegle-layout.workspace = true
aegle-text = { workspace = true, features = ["scene"] }
png = "0.18.1"

[lints]
workspace = true

[[example]]
name = "text_scene"
required-features = ["text"]

[[example]]
name = "editor_scene"
required-features = ["text"]
