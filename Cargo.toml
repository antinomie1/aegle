[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-only"

[workspace.dependencies]
aegle-types = { path = "crates/aegle-types" }
aegle-core = { path = "crates/aegle-core" }
aegle-layout = { path = "crates/aegle-layout" }
aegle-scene = { path = "crates/aegle-scene" }
aegle-render-software = { path = "crates/aegle-render-software" }
aegle-text = { path = "crates/aegle-text" }
aegle-glyph = { path = "crates/aegle-glyph" }
aegle-controls = { path = "crates/aegle-controls" }
aegle-access = { path = "crates/aegle-access" }
aegle-theme = { path = "crates/aegle-theme" }
aegle-app = { path = "crates/aegle-app" }
aegle-platform-wayland = { path = "crates/aegle-platform-wayland" }
aegle-markup = { path = "crates/aegle-markup" }
aegle-macros = { path = "crates/aegle-macros" }
aegle-motion = { path = "crates/aegle-motion" }
accesskit = { version = "0.24.1", default-features = false }
linebender_resource_handle = { version = "0.1.1", default-features = false }
parley = { version = "0.11.1", default-features = false, features = ["std"] }
swash = { version = "0.2.10", default-features = false, features = ["std", "render"] }
taffy = { version = "0.14.0", default-features = false, features = ["std", "flexbox", "block_layout", "content_size"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
