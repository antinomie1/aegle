[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/antinomie1/aegle"
readme = "README.md"
keywords = ["gui", "ui", "retained", "text", "accessibility"]
categories = ["gui", "graphics"]

[workspace.dependencies]
aegle-types = { path = "crates/aegle-types" }
aegle-core = { path = "crates/aegle-core" }
aegle-layout = { path = "crates/aegle-layout" }
aegle-scene = { path = "crates/aegle-scene" }
aegle-render-software = { path = "crates/aegle-render-software" }
aegle-gpu = { path = "crates/aegle-gpu" }
aegle-render-vulkan = { path = "crates/aegle-render-vulkan" }
aegle-render-wgpu = { path = "crates/aegle-render-wgpu" }
aegle-text = { path = "crates/aegle-text" }
aegle-glyph = { path = "crates/aegle-glyph" }
aegle-controls = { path = "crates/aegle-controls" }
aegle-access = { path = "crates/aegle-access" }
aegle-theme = { path = "crates/aegle-theme" }
aegle-widgets = { path = "crates/aegle-widgets" }
aegle-app = { path = "crates/aegle-app" }
aegle-ui = { path = "crates/aegle-ui" }
aegle-platform-wayland = { path = "crates/aegle-platform-wayland" }
aegle-platform-win32 = { path = "crates/aegle-platform-win32" }
aegle-markup = { path = "crates/aegle-markup" }
aegle-macros = { path = "crates/aegle-macros" }
aegle-loader = { path = "crates/aegle-loader" }
aegle-motion = { path = "crates/aegle-motion" }
aegle-image = { path = "crates/aegle-image" }
accesskit = { version = "0.24.1", default-features = false }
linebender_resource_handle = { version = "0.1.1", default-features = false }
parley = { version = "0.11.1", default-features = false, features = ["std"] }
swash = { version = "0.2.10", default-features = false, features = ["std", "render"] }
taffy = { version = "0.14.0", default-features = false, features = ["std", "flexbox", "block_layout", "content_size"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Debug builds keep application code debuggable but optimize dependencies and
# the crates with per-pixel loops (the software renderer and the platforms'
# pixel conversion), so examples stay interactive.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.aegle-render-software]
opt-level = 2

[profile.dev.package.aegle-platform-wayland]
opt-level = 2

[profile.dev.package.aegle-platform-win32]
opt-level = 2

# rustc 1.96 overflows its stack optimizing wgpu-core here; it has no pixel loops.
[profile.dev.package.wgpu-core]
opt-level = 0
